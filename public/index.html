<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Player Pong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lobby">
    <div class="lobby-box">
      <h1>🏓 4-Player Pong</h1>
      <p class="subtitle">Classic Pong. Up to 4 Players. One Arena.</p>
      <div class="input-group">
        <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="15">
        <input type="text" id="roomInput" placeholder="Room code (optional)" maxlength="10">
      </div>
      <button id="joinBtn">Join Game</button>
      <div id="players-preview">
        <h3>Waiting for players...</h3>
        <div id="player-slots">
          <div class="slot empty" data-slot="0">️ Player 1</div>
          <div class="slot empty" data-slot="1">➡️ Player 2</div>
          <div class="slot empty" data-slot="2">⬆️ Player 3</div>
          <div class="slot empty" data-slot="3">⬇️ Player 4</div>
        </div>
        <p class="hint">Need at least 2 players to start</p>
      </div>
    </div>
  </div>

  <div id="game-container" style="display:none">
    <div id="game-header">
      <div id="scoreboard"></div>
      <button id="leaveBtn">Leave</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="game-hud" class="hud">
      <span id="controls-info">W/S to move</span>
    </div>
    <div id="countdown" style="display:none"></div>
  </div>

  <div id="gameover-overlay" style="display:none">
    <div class="gameover-box">
      <h2 id="winner-text">Game Over!</h2>
      <p id="gameover-detail"></p>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
